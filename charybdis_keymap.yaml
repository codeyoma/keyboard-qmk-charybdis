  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - Test
  Mouse:
  - ['', '', '', '', '', '', '', '', '', '']
  - [LCTL, LGUI, LALT, LSFT, DPI+, Back, Left click, Right click, Middle click, Forward]
